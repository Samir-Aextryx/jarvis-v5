[package]
name = "jarvis"
version = "5.2.2"
edition = "2024"
publish = false
description = "Jarvis v5 backend in Rust, compiled to WebAssembly and run by stock Electron"
license-file = "../LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
httparse = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
regex = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
